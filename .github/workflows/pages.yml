name: Publicar EarthRhythm en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Generar el sitio principal y las versiones
        env:
          BRISA_PROXY_URL: ${{ vars.BRISA_PROXY_URL }}
        run: |
          python3 scripts/build_pages.py _site
          git fetch --depth=1 origin \
            refs/heads/V1:refs/remotes/origin/V1 \
            refs/heads/V2:refs/remotes/origin/V2 \
            refs/heads/V3:refs/remotes/origin/V3
          for version in v1 v2 v3; do
            branch="${version^^}"
            worktree="$RUNNER_TEMP/earthbeat-$version"
            git worktree add --detach "$worktree" "refs/remotes/origin/$branch"
            python3 "$worktree/scripts/build_pages.py" "$GITHUB_WORKSPACE/_site/$version"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
